<svg xmlns="http://www.w3.org/2000/svg" width="106" height="114" viewBox="0 0 106 114" fill="none">
  <style>
    .cam { animation-duration: 3.2s; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
    .n0 { animation-name: f0; }
    @keyframes f0 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5.0px); } }
    .n1 { animation-name: f1; }
    @keyframes f1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4.0px); } }
    .n2 { animation-name: f2; }
    @keyframes f2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.0px); } }
    .n3 { animation-name: f3; }
    @keyframes f3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.2px); } }
    .n4 { animation-name: f4; }
    @keyframes f4 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @media (prefers-reduced-motion: reduce) { .cam { animation: none; } }
  </style>
